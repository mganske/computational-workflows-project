repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - LICENSE
    - docs/CONTRIBUTING.md
    - CODE_OF_CONDUCT.md
    - assets/nf-core-course-2026-project_logo_light.png
    - docs/images/nf-core-course-2026-project_logo_light.png
    - docs/images/nf-core-course-2026-project_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/workflows/branch.yml
    - .github/workflows/pr-comment.yml
    - .github/workflows/linting.yml
    - .github/.dockstore.yml
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - LICENSE
    - CODE_OF_CONDUCT.md
    - assets/nf-core-course-2026-project_logo_light.png
    - docs/images/nf-core-course-2026-project_logo_light.png
    - docs/images/nf-core-course-2026-project_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/.dockstore.yml
    - docs/CONTRIBUTING.md
    - CHANGELOG.md
  readme:
    - nextflow_badge

template:
  org: mganske
  name: Course-2026-project
  description: Pipeline for the course "Computational Workflows" Summer Semester 2026
  author: Marcus Ganske, David Ebordiga
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - github
    - changelog
    - license
    - gpu
    - codespaces
  is_nfcore: false
